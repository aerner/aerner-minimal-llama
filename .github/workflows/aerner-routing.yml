name: Aerner folder routing metadata
on:
  push:
    paths: ['**/aerner.project.yaml', '.aerner/routing/**', '.github/workflows/aerner-routing.yml']
  pull_request:
    paths: ['**/aerner.project.yaml', '.aerner/routing/**', '.github/workflows/aerner-routing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install distro validator dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml python3-jsonschema
      - name: Validate schema, inheritance and folder references
        run: /usr/bin/python3 .aerner/routing/validate.py .
